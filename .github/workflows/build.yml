name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 直接创建 gradlew 和 wrapper 文件（不依赖外部下载）
      - name: Create Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          # 创建 gradle-wrapper.properties
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          # 创建 gradlew（这是一个简化版，但足够调用 gradle）
          cat > gradlew << 'EOF'
          #!/bin/sh
          # Gradle startup script
          if [ -z "$GRADLE_HOME" ]; then
            GRADLE_HOME="$HOME/.gradle"
          fi
          exec "$JAVA_HOME/bin/java" -cp "$GRADLE_HOME/wrapper/dists/gradle-8.4-bin/*/gradle-8.4/lib/gradle-launcher-*.jar" org.gradle.launcher.GradleMain "$@"
          EOF
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
